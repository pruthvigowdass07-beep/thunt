[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "thunt"
version = "0.1.0"
description = "Unified terminal threat-hunting tool. Enrich an IP, domain, URL, or file hash from many free intel sources in one color-coded view."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "thunt" }]
keywords = ["threat-intelligence", "soc", "ioc", "osint", "security", "cli"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
]
dependencies = [
    "httpx>=0.27",
    "rich>=13.7",
]

[project.optional-dependencies]
# Best-effort scraping of Cloudflare / reCAPTCHA-guarded sites (VirusTotal community,
# Talos) when you have no API key. Install with: pipx install "thunt[scrape]"
scrape = ["playwright>=1.44"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21"]

[project.urls]
Homepage = "https://github.com/yourname/thunt"

[project.scripts]
thunt = "thunt.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["thunt"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
